# .github/workflows/build-windows.yml
name: Build Windows EXE (PyInstaller)

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']  # tag like v1.0 to auto-publish a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            pip install pygame
          }
          pip install pyinstaller

      - name: Build EXE with assets
        shell: pwsh
        run: |
          # Resolve asset directories if they exist
          $candidateDirs = @("images","rooms","sounds","fonts","assets")
          $add = @()
          foreach ($d in $candidateDirs) {
            if (Test-Path $d) {
              $src = (Resolve-Path $d).Path
              $add += @("--add-data", "$src;$d")
            }
          }

          # Build (no --specpath so add-data sources are absolute)
          pyinstaller --noconfirm --clean `
            --name VahvuusVaris `
            --onefile --noconsole `
            --workpath pyi_build --distpath pyi_dist `
            $add `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VahvuusVaris-windows
          path: pyi_dist/VahvuusVaris.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: VahvuusVaris-windows
          path: dist

      - name: Zip
        run: |
          cd dist
          zip -9 VahvuusVaris-windows.zip VahvuusVaris.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VahvuusVaris-windows.zip
