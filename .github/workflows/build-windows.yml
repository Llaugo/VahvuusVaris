name: Build Windows EXE (PyInstaller)

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']   # tag like v1.0 to auto-publish a release build

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          # Avoid clobbering your existing "build" dir by using custom paths
          pyinstaller --noconfirm --clean `
            --name VahvuusVaris `
            --onefile --noconsole `
            --workpath pyi_build --distpath pyi_dist --specpath pyi_spec `
            --add-data "images;images" `
            --add-data "rooms;rooms" `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VahvuusVaris-windows
          path: pyi_dist/VahvuusVaris.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: VahvuusVaris-windows
          path: dist

      - name: Create ZIP
        run: |
          cd dist
          zip -9 VahvuusVaris-windows.zip VahvuusVaris.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VahvuusVaris-windows.zip
