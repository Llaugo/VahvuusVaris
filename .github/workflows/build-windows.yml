# .github/workflows/build-windows.yml
name: Build Windows EXE (PyInstaller)

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            pip install pygame numpy
          }
          pip install pyinstaller

      - name: Build EXE with assets
        shell: pwsh
        run: |
          $dirs = @("images","rooms","sounds","fonts","assets")
          $add = @()
          foreach ($d in $dirs) {
            if (Test-Path $d) {
              $src = (Resolve-Path $d).Path
              $add += @("--add-data", "$src;$d")
            }
          }

          pyinstaller --noconfirm --clean `
            --name VahvuusVaris `
            --onefile --noconsole `
            --workpath pyi_build --distpath pyi_dist `
            --hidden-import numpy `
            --collect-all numpy `
            $add `
            main.py

      - uses: actions/upload-artifact@v4
        with:
          name: VahvuusVaris-windows
          path: pyi_dist/VahvuusVaris.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VahvuusVaris-windows
          path: dist
      - run: |
          cd dist
          zip -9 VahvuusVaris-windows.zip VahvuusVaris.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/VahvuusVaris-windows.zip
