name: Build Windows EXE (PyInstaller)

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps (pygame + optional reqs) and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE (verbose) 
        shell: pwsh
        run: |
          $addArgs = @()
          if (Test-Path images) { $addArgs += @('--add-data','images;images') }
          if (Test-Path rooms)  { $addArgs += @('--add-data','rooms;rooms') }

          pyinstaller --noconfirm --clean `
            --name VahvuusVaris `
            --onefile --noconsole --log-level DEBUG `
            --workpath pyi_build --distpath pyi_dist --specpath pyi_spec `
            $addArgs main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VahvuusVaris-windows
          path: pyi_dist/VahvuusVaris.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VahvuusVaris-windows
          path: dist
      - run: cd dist && tar -a -c -f VahvuusVaris-windows.zip VahvuusVaris.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/VahvuusVaris-windows.zip
